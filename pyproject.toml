[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "creatify_as"
version = "0.1.0"
description = "In-memory AWS service simulators for Creatify tests (AppStream, DynamoDB, EC2, Step Functions ASL)."
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.41",
  "botocore>=1.41",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
awsim_fleet_create = "creatify_as.entrypoint.awsim_fleet_create:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
